<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="navbar">
        <div class="logo">AI Resume Analyzer</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </div>
    </div>

    <div class="form-box">

        <h2>Login</h2>

        <form method="POST" action="/login">

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>
<footer style="text-align:center; padding:20px; color:#aaa;">
    Built with FastAPI • AI Resume Analyzer
</footer>
</body>
</html>
